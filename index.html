<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0033">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Аня ✨</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/mic.css">
  <link rel="stylesheet" href="css/chats.css">
</head>
<body class="theme-night">

  <div class="stars"></div>
  <div class="particles" id="particles"></div>
  <div class="recording-indicator" id="recordingIndicator"></div>

  <button id="helpBtn" class="help-btn" title="Помощь">🆘</button>

  <div class="app">
    <header>
      <div class="header-row">
        <button id="chatsToggle" class="chats-toggle" title="Чаты">☰</button>
        <div>
          <h1>Аня <span class="sparkle">✨</span></h1>
          <p class="sub">
            <span class="status-dot"></span>
            <span id="statusLabel">онлайн</span>
          </p>
        </div>
      </div>
    </header>

    <div id="chat" class="chat"></div>

    <div class="input-row">
      <button id="micBtn" class="mic-btn" title="Голосовой ввод">🎤</button>
      <input id="input" type="text" placeholder="Напиши Ане..." autocomplete="off">
      <button id="send" title="Отправить" disabled>➤</button>
    </div>
  </div>

  <!-- ЗАТЕМНЕНИЕ -->
  <div class="chats-backdrop" id="chatsBackdrop"></div>

  <!-- ПАНЕЛЬ ЧАТОВ -->
  <div class="chats-panel" id="chatsPanel">
    <div class="chats-panel-header">
      <h3>💬 Мои чаты</h3>
      <div class="chats-panel-actions">
        <button class="chats-action new" id="newChatBtn" title="Новый чат">➕</button>
        <button class="chats-action close" id="closeChatsBtn" title="Закрыть">✕</button>
      </div>
    </div>
    <div class="chats-list" id="chatsList"></div>
  </div>

  <!-- ПОМОЩЬ -->
  <div class="menu-overlay" id="helpOverlay">
    <div class="menu help-menu">
      <h2>🆘 Если тебе плохо</h2>
      <div id="helpContent" class="help-content"></div>
      <button class="close-menu" id="closeHelp">Закрыть</button>
    </div>
  </div>

  <!-- ДАННЫЕ -->
  <script src="js/data/phrases.js"></script>
